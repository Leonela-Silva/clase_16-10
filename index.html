<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediData Pro - Panel Médico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">🩺</div>
                <div>
                    <h1>MediData <span>Pro</span></h1>
                    <p>Gestión de Pacientes e Historial Clínico</p>
                </div>
            </div>
            <div class="status-indicator">
                <span class="dot"></span> Sistema Conectado
            </div>
        </header>

        <!-- Layout Principal -->
        <div class="grid-layout">
            
            <!-- Panel Izquierdo: Formulario -->
            <aside class="card">
                <h2 class="card-title">➕ Registrar Paciente</h2>
                
                <form id="pacienteForm" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label for="nombre">Nombre y Apellido</label>
                        <input type="text" id="nombre" placeholder="Ej. Ana García" required>
                    </div>

                    <div class="form-group">
                        <label for="dni">DNI / Documento</label>
                        <input type="text" id="dni" placeholder="Ej. 30123456" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" placeholder="Ej. 1198765432">
                    </div>

                    <div class="form-group">
                        <label for="email">Email / Observaciones</label>
                        <input type="text" id="email" placeholder="Ej. paciente@email.com">
                    </div>

                    <div class="btn-group" style="margin-top: 15px;">
                        <button type="button" id="btnGuardar" class="btn btn-primary" style="width: 100%;">💾 Guardar Paciente</button>
                    </div>
                </form>

                <!-- Cartel indicador de estado / errores -->
                <p id="statusMsg" class="status-banner" style="margin-top: 15px; font-weight: bold;"></p>
            </aside>

            <!-- Panel Derecho: Lista e Historial -->
            <main class="card">
                <div class="list-header">
                    <h2 class="card-title" style="margin-bottom: 0;">📋 Registros de Pacientes</h2>
                    <div class="search-box">
                        <input type="text" id="buscarInput" placeholder="🔍 Buscar por DNI o Nombre...">
                    </div>
                </div>

                <div id="listaPacientes" class="patient-list" style="margin-top: 15px;">
                    <div class="empty-state">Iniciando consulta a Supabase...</div>
                </div>
            </main>

        </div>
    </div>

    <!-- Scripts en Orden Correcto -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="conexion.js"></script>
    <script src="app.js"></script>
</body>
</html>
