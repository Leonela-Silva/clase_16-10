<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes | MediData</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Cliente oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="dashboard-container">
        <!-- Encabezado Principal -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">🩺</div>
                <div>
                    <h1>MediData <span>Pro</span></h1>
                    <p>Sistema de Control y Gestión Médica</p>
                </div>
            </div>
            <div class="status-indicator">
                <span class="dot"></span> Supabase Conectado
            </div>
        </header>

        <!-- Contenido en Dos Columnas -->
        <div class="grid-layout">
            <!-- Columna Izquierda: Formulario de Carga -->
            <aside class="card">
                <h2 class="card-title">➕ Nuevo Paciente</h2>
                
                <form id="pacienteForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>Nombre y Apellido</label>
                        <input type="text" id="nombre" placeholder="Ej. Dra. María Pérez" required>
                    </div>

                    <div class="form-group">
                        <label>DNI / Documento</label>
                        <input type="text" id="dni" placeholder="Ej. 38123456" required>
                    </div>

                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="telefono" placeholder="Ej. 1123456789">
                    </div>

                    <div class="form-group">
                        <label>Diagnóstico / Observación</label>
                        <input type="text" id="diagnostico" placeholder="Ej. Control preventivo">
                    </div>

                    <div class="btn-group">
                        <button type="button" id="btnGuardar" class="btn btn-primary">💾 Guardar</button>
                        <button type="button" id="btnCargar" class="btn btn-secondary" title="Sincronizar base de datos">🔄</button>
                    </div>
                </form>

                <p id="statusMsg" class="status-banner"></p>
            </aside>

            <!-- Columna Derecha: Búsqueda y Lista de Pacientes -->
            <main class="card">
                <div class="list-header">
                    <h2 class="card-title" style="margin-bottom:0;">📋 Nómina de Pacientes</h2>
                    <div class="search-box">
                        <input type="text" id="buscarInput" placeholder="🔍 Buscar por DNI o Nombre...">
                    </div>
                </div>

                <div id="listaPacientes" class="patient-list">
                    <div class="empty-state">Cargando registros de Supabase...</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Script Lógico de la App -->
    <script src="app.js"></script>
</body>
</html>
