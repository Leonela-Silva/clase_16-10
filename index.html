<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Supabase</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Cargamos la librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="panel">
        <h2>🔥 Conexión a Supabase</h2>
        
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" id="nombreInput" placeholder="Ej: Leonela">
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="emailInput" placeholder="Ej: usuario@gmail.com">
        </div>

        <div class="buttons">
            <button id="btnGuardar" class="btn btn-primary">💾 Guardar Registro</button>
            <button id="btnCargar" class="btn btn-secondary">🔄 Cargar Registros</button>
        </div>

        <p id="statusMsg" class="status"></p>

        <h3>Registros en la Base de Datos:</h3>
        <ul id="listaDatos" class="data-list"></ul>
    </div>

    <!-- Carga normal de JavaScript sin type="module" -->
    <script src="app.js"></script>
</body>
</html>
