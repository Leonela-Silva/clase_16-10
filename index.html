<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediData Pro - Control Médico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Encabezado del Sistema -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">🩺</div>
                <div>
                    <h1>MediData <span>Pro</span></h1>
                    <p>Gestión de Pacientes e Historial Clínico</p>
                </div>
            </div>
            <div class="status-indicator">
                <span class="dot"></span> Sistema Conectado
            </div>
        </header>

        <!-- Panel de Control Principal -->
        <div class="grid-layout">
            <!-- Formulario de Registro -->
            <aside class="card">
                <h2 class="card-title">➕ Registrar Paciente</h2>
                
                <form id="pacienteForm" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label for="nombre">Nombre y Apellido</label>
                        <input type="text" id="nombre" placeholder="Ej. Dra. María Pérez" required>
                    </div>

                    <div class="form-group">
                        <label for="dni">DNI / Documento</label>
                        <input type="text" id="dni" placeholder="Ej. 38123456" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" placeholder="Ej. 1123456789">
                    </div>

                    <div class="form-group">
                        <label for="diagnostico">Observaciones / Email</label>
                        <input type="text" id="diagnostico" placeholder="Ej. paciente@email.com o nota">
                    </div>

                    <div class="btn-group">
                        <button type="button" id="btnGuardar" class="btn btn-primary">💾 Guardar Paciente</button>
                        <button type="button" id="btnCargar" class="btn btn-secondary" title="Sincronizar">🔄</button>
                    </div>
                </form>

                <p id="statusMsg" class="status-banner"></p>
            </aside>

            <!-- Lista de Historial de Pacientes -->
            <main class="card">
                <div class="list-header">
                    <h2 class="card-title" style="margin-bottom:0;">📋 Historial de Registros</h2>
                    <div class="search-box">
                        <input type="text" id="buscarInput" placeholder="🔍 Buscar por DNI o Nombre...">
                    </div>
                </div>

                <div id="listaPacientes" class="patient-list">
                    <div class="empty-state">Iniciando conexión con Supabase...</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts cargados en el orden estricto -->
    <!-- 1. Librería CDN de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Inicialización de la conexión global (conexion.js) -->
    <script src="conexion.js"></script>
    
    <!-- 3. Funciones y eventos del panel (app.js) -->
    <script src="app.js"></script>
</body>
</html>
